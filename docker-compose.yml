services:
  db:
    image: postgres:16-alpine
    container_name: client_database
    env_file:
      - db/.env
      
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client_backend
    env_file:
      - backend/.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/static
      dockerfile: Dockerfile
    container_name: client_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
